# Blueprint do Render (https://render.com): New > Blueprint > escolha este repositório.
# Cria o serviço web (Docker) e o PostgreSQL. Preencha as variáveis marcadas com sync:false no painel.
services:
  - type: web
    name: helpconcurso
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: helpconcurso-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REGISTRATION_MODE
        value: allowlist
      - key: ALLOWED_EMAILS
        sync: false
      - key: AI_TRAINING_MODE
        value: batch
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
databases:
  - name: helpconcurso-db
    plan: basic-256mb
