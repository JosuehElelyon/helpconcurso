# Blueprint do Render (https://render.com): New > Blueprint > escolha este repositório.
# Cria a API (web), o worker da fila de IA e o PostgreSQL. As variáveis comuns ficam no grupo "helpconcurso-comum";
# preencha as marcadas com sync:false no painel. API e worker escalam separados (numInstances / autoscaling).
envVarGroups:
  - name: helpconcurso-comum
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REGISTRATION_MODE
        value: allowlist
      - key: ALLOWED_EMAILS
        sync: false
      - key: AI_TRAINING_MODE
        value: batch
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

services:
  # API HTTP
  - type: web
    name: helpconcurso
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - fromGroup: helpconcurso-comum
      - key: PROCESS_ROLE
        value: api
      - key: DATABASE_URL
        fromDatabase: { name: helpconcurso-db, property: connectionString }

  # Worker da fila de IA (mesma imagem, outro comando)
  - type: worker
    name: helpconcurso-worker
    runtime: docker
    plan: starter
    dockerCommand: node src/worker.js
    envVars:
      - fromGroup: helpconcurso-comum
      - key: PROCESS_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase: { name: helpconcurso-db, property: connectionString }

databases:
  - name: helpconcurso-db
    plan: basic-256mb
