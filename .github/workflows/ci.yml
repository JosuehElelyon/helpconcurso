name: CI
on: [push, pull_request]

jobs:
  # Testes automatizados (IA simulada) + checagens de código e do contrato da API
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: helpconcurso }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/helpconcurso
      JWT_SECRET: ci_secret_ci_secret_ci_secret_ci_secret_123
      AI_MOCK: "true"
      S3_DISABLED: "true"
      ADMIN_EMAILS: admin@teste.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint (sintaxe + nome usado sem estar definido, no front e no back)
        run: npm run lint
      - name: Contrato OpenAPI exportado está em dia (rode "npm run openapi" e faça commit de docs/openapi.json)
        run: npm run openapi && git diff --exit-code docs/openapi.json
      - name: Testes (API, worker, fila, limites, contrato, front separado)
        run: npm test

  # Infraestrutura: docker-compose válido, configuração do Nginx do front e imagem da API construindo
  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: docker-compose.yml válido
        run: touch .env && docker compose config -q
      - name: Nginx do front (template + nginx -t)
        run: >
          docker run --rm -e API_UPSTREAM=http://127.0.0.1:3000 -e NGINX_RESOLVER=127.0.0.11 -e API_URL=/api/v1 -e CSP_EXTRA_ORIGENS=
          -v "$PWD/deploy/nginx:/etc/nginx/templates:ro" nginx:1.27-alpine
          sh -c "/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t"
      - name: Imagem da API/worker
        run: docker build -t helpconcurso:ci .
