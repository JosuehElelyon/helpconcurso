# Sobe o HelpConcurso completo no seu computador:
#   docker compose up -d --build
# Dois processos com a mesma imagem: "app" (API HTTP) e "worker" (fila de IA) — escalam separados:
#   docker compose up -d --scale worker=2
# App (front + API via Nginx): http://localhost:3000 · API direta: http://127.0.0.1:3100 · E-mails (Mailpit): http://localhost:8025 · Arquivos (MinIO): http://localhost:9001
# Para deixar público pela internet: docker compose --profile publico up -d   (veja docs/DEPLOY.md)

x-ambiente: &ambiente
  DATABASE_URL: postgresql://helpconcurso:helpconcurso@db:5432/helpconcurso
  DATABASE_SSL: "false"
  # SMTP: usa o do .env (ex.: Brevo); se SMTP_HOST estiver vazio, usa o Mailpit local (http://localhost:8025)
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  # Arquivos: MinIO local (troque por S3_ENDPOINT_COMPOSE=https://... para usar R2/S3 na nuvem)
  S3_ENDPOINT: ${S3_ENDPOINT_COMPOSE:-http://minio:9000}
  # Só desenvolvimento: proxy Free Claude Code (FCC_ENABLED) e Ollama (OLLAMA_ENABLED) rodando no host Windows
  FCC_BASE_URL: ${FCC_BASE_URL:-http://host.docker.internal:8082}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}

x-codigo: &codigo
  - ./src:/app/src
  - ./public:/app/public
  - ./migrations:/app/migrations

services:
  # Front (Nginx): entrega public/ e repassa /api para a API. É a porta de entrada: http://localhost:3000
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://app:3000
      API_URL: /api/v1
      CSP_EXTRA_ORIGENS: ""
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx:/etc/nginx/templates:ro
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/config.js"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on: [app]

  # API HTTP (só /api; o front fica no "web"). Acesso direto, para depurar: http://127.0.0.1:3100/api/v1/health
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *ambiente
      PROCESS_ROLE: api
      SERVIR_FRONT: "false"
      # Proxies na frente: Nginx (1). Com o túnel Cloudflare do perfil "publico" (túnel → Nginx → API), use 2.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3000"
    volumes: *codigo
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }

  # Worker da fila de IA (provas, lote, rotulagem, erro reportado). Sem porta pública.
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: .env
    environment:
      <<: *ambiente
      PROCESS_ROLE: worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *codigo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpconcurso
      POSTGRES_PASSWORD: helpconcurso
      POSTGRES_DB: helpconcurso
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpconcurso"]
      interval: 5s
      retries: 10

  # Armazenamento S3 local. A imagem minio/minio saiu do Docker Hub (nov/2026); no lugar dela, SeaweedFS com API S3.
  # O nome do serviço continua "minio" para não mudar S3_ENDPOINT. Sem identidades configuradas o S3 aceita qualquer
  # chave — por isso a porta só abre em 127.0.0.1 (uso local). Arquivos antigos do MinIO ficam em ./data/minio (formato MinIO).
  minio:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0
    volumes:
      - ./data/seaweedfs:/data
    ports:
      - "127.0.0.1:9000:9000"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # Antivírus opcional: docker compose --profile antivirus up -d  (e CLAMAV_HOST=clamav no .env)
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped

  # Túnel Cloudflare: expõe o app na internet com HTTPS, sem abrir portas no roteador
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["publico"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web]   # o túnel aponta para http://web:80 (front + API)
