<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <linearGradient id="owlBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg6)"/>

  <!-- Owl Body -->
  <ellipse cx="64" cy="76" rx="34" ry="38" fill="url(#owlBody)"/>
  <!-- Belly -->
  <ellipse cx="64" cy="84" rx="22" ry="24" fill="url(#owlBelly)"/>
  <!-- Belly feather flecks -->
  <path d="M56 78 Q64 82 72 78 M54 88 Q64 92 74 88 M58 98 Q64 101 70 98" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>

  <!-- Owl Wings -->
  <ellipse cx="32" cy="78" rx="8" ry="22" fill="#57534e"/>
  <ellipse cx="96" cy="78" rx="8" ry="22" fill="#57534e"/>

  <!-- Eye Sockets (White/Cream circles) -->
  <circle cx="50" cy="58" r="14" fill="#ffffff"/>
  <circle cx="78" cy="58" r="14" fill="#ffffff"/>

  <!-- Iris (Golden amber) -->
  <circle cx="50" cy="58" r="9" fill="#f59e0b"/>
  <circle cx="78" cy="58" r="9" fill="#f59e0b"/>

  <!-- Pupil (Deep black) -->
  <circle cx="50" cy="58" r="5" fill="#0f172a"/>
  <circle cx="78" cy="58" r="5" fill="#0f172a"/>

  <!-- Light reflections -->
  <circle cx="48" cy="55" r="2" fill="#ffffff"/>
  <circle cx="76" cy="55" r="2" fill="#ffffff"/>

  <!-- Beak -->
  <polygon points="64,63 58,72 70,72" fill="#ea580c"/>

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Skullcap base -->
  <path d="M48 38 C48 34 80 34 80 38 L80 43 C80 43 64 45 48 43 Z" fill="#1e293b"/>
  <!-- Diamond top -->
  <polygon points="64,22 96,33 64,42 32,33" fill="#0f172a"/>
  <!-- Center button -->
  <circle cx="64" cy="32" r="3" fill="#eab308"/>
  <!-- Tassel ribbon & pendant -->
