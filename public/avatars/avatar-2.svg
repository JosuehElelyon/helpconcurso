<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg2)"/>

  <!-- Table surface hint -->
  <ellipse cx="64" cy="116" rx="48" ry="8" fill="#78350f" opacity="0.4"/>

  <!-- Bottom Book (Blue) -->
  <rect x="26" y="96" width="76" height="15" rx="3" fill="url(#book1)"/>
  <rect x="30" y="99" width="68" height="9" fill="#f8fafc"/>
  <line x1="36" y1="103" x2="92" y2="103" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Middle Book (Green) -->
  <rect x="32" y="82" width="66" height="14" rx="3" fill="url(#book2)"/>
  <rect x="36" y="85" width="58" height="8" fill="#f8fafc"/>
  <!-- Bookmark ribbon hanging down -->
  <path d="M42 85 L42 105 L46 102 L50 105 L50 85 Z" fill="#fbbf24"/>

  <!-- Top Book (Red/Rose) -->
  <rect x="38" y="70" width="54" height="12" rx="3" fill="url(#book3)"/>
  <rect x="42" y="73" width="46" height="6" fill="#f8fafc"/>

  <!-- Coffee Mug -->
  <rect x="52" y="44" width="24" height="24" rx="4" fill="#ffffff"/>
  <!-- Handle -->
  <path d="M76 49 C82 49 83 61 76 63" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Heart or emblem on mug -->
  <path d="M64 58 C62 55 58 55 58 58 C58 61 64 64 64 64 C64 64 70 61 70 58 C70 55 66 55 64 58 Z" fill="#ef4444"/>

  <!-- Steam lines -->
  <path d="M57 38 Q55 32 58 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M64 36 Q67 30 63 22" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M71 38 Q69 32 72 26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
</svg>
