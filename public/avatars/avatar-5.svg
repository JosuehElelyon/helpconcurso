<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="glass5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg5)"/>

  <!-- Chart Board / Clipboard Background -->
  <rect x="30" y="30" width="68" height="74" rx="8" fill="#ffffff" opacity="0.95"/>
  <!-- Top clip -->
  <rect x="50" y="24" width="28" height="10" rx="3" fill="#cbd5e1"/>
  <rect x="56" y="22" width="16" height="4" rx="2" fill="#64748b"/>

  <!-- Chart Bars -->
  <rect x="38" y="78" width="10" height="18" rx="2" fill="#10b981"/>
  <rect x="52" y="64" width="10" height="32" rx="2" fill="#3b82f6"/>
  <rect x="66" y="52" width="10" height="44" rx="2" fill="#6366f1"/>
  <rect x="80" y="42" width="10" height="54" rx="2" fill="#f59e0b"/>

  <!-- Trend upward line -->
  <path d="M42 74 L57 60 L71 48 L85 38" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="85" cy="38" r="3.5" fill="#ef4444"/>

  <!-- Magnifying Glass (Fiscal Audit) -->
  <circle cx="76" cy="74" r="18" fill="url(#glass5)" fill-opacity="0.75" stroke="#1e293b" stroke-width="4.5"/>
  <!-- Handle -->
  <line x1="89" y1="87" x2="106" y2="104" stroke="#1e293b" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Checkmark inside glass -->
  <path d="M68 74 L73 79 L84 68" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
